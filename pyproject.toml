[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ecoli-imaging"
version = "1.0.0"
description = "Polar localization and cell-cell adhesion analysis for phase-contrast and fluorescence images of E. coli"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "iGEM Keio 2026" }]
keywords = ["microscopy", "segmentation", "bacteria", "fluorescence", "omnipose", "iGEM"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "tifffile>=2023.2",
    "pillow>=9.5",
]

[project.optional-dependencies]
# Needed only to segment images; not required when masks are supplied with --masks.
segmentation = ["omnipose>=1.0"]

[tool.setuptools]
packages = ["ecoli_imaging"]
